id: best-week-sales
title: The best stretch of days for a market stall
type: algorithm
difficulty: 3
sequence: 11
context: market
skills:
  - dsa.sliding-window
  - dsa.complexity
targetLevel: 3
objective: Slide a fixed-size window across a list, adding one day and dropping one, instead of
  re-adding every window.
lesson:
  concept: A sliding window updates its total by what enters and what leaves, instead of recounting
  realWorldProblem: A market stall owner has the takings for each day of the year and wants to know
    their best run of 7 days in a row, to plan the next season. Adding up every 7-day stretch from
    scratch is a lot of repeated adding.
  whyItExists: Neighbouring stretches share almost all their days. The stretch from Tuesday to Monday
    and the one from Wednesday to Tuesday differ by one day in and one day out. Adding everything
    again wastes the work you just did.
  howItWorks: "Add up the first k days once. Then slide one day to the right: add the new day that
    enters and subtract the day that leaves. After each slide, compare with the best total so far.
    You do n steps of constant work, so O(n) time, however big k is. Recounting every window costs
    about n × k."
  example:
    code: |-
      function bestOf3(nums) {
        let window = nums[0] + nums[1] + nums[2];
        let best = window;
        for (let i = 3; i < nums.length; i++) {
          window = window + nums[i] - nums[i - 3];
          if (window > best) best = window;
        }
        return best;
      }

      bestOf3([1, 2, 3, 10, 1, 1]); // 15
    explanation: The first window is 1 + 2 + 3 = 6. Sliding in the 10 and out the 1 gives 6 + 10 - 1 =
      15. Sliding again gives 15 + 1 - 2 = 14, then 14 + 1 - 3 = 12. The best is 15.
  predict:
    code: |-
      const nums = [4, 1, 7, 2];
      let window = nums[0] + nums[1];
      window = window + nums[2] - nums[0];
      console.log(window);
    question: A window of size 2 slides one step. What does this print?
    answer: "8"
    why: "The first window is 4 + 1 = 5. Sliding adds the entering 7 and subtracts the leaving 4: 5 + 7
      - 4 = 8. That equals 1 + 7, the new window, without re-adding it."
  commonMistake: Starting the best total at 0. If every day is a loss (negative), 0 would beat every
    real window and be wrongly returned.
problem: |-
  Write `bestStretch(takings, days)` and export it from solution.js. `takings` is a list of whole numbers of cents, one per day (a day can be negative when there were refunds). Return the biggest total of any `days` days in a row.

  If `days` is not a whole number from 1 up to the number of days in the list, throw a `RangeError`.
requirements:
  - Return the largest sum of `days` consecutive values.
  - Negative values are allowed. If every window is negative, return the least negative one.
  - Throw a RangeError if days is less than 1, not a whole number, or longer than the list.
  - Finish in well under half a second for 500,000 days with a window of 250,000.
constraints:
  - Don't change the array you are given.
examples:
  - input: bestStretch([1, 2, 3, 10, 1, 1], 3)
    output: "15"
  - input: bestStretch([-5, -2, -9], 2)
    output: "-7"
    note: The windows are -7 and -11.
  - input: bestStretch([4], 1)
    output: "4"
edgeCasesToConsider:
  - A window as long as the whole list?
  - All negative values?
  - A window of one day?
  - The best window at the very start, or the very end?
beforeCoding:
  - For [1, 2, 3, 10, 1, 1] and days = 3, write each window's total. Which total can you get from
    the one before it with a single add and subtract?
  - How many windows are there in a list of n days with window size k?
hints:
  - Neighbouring windows share most of their days. What changes when the window moves one step?
  - Add up the first window once. Then, for each step, add the new day and subtract the day that
    left.
  - Make sure the last window is included, and start `best` from a real window, not from 0.
  - "Shape: let window = sum of the first `days` values; let best = window; for (let i = days; i <
    takings.length; i++) { window = window + takings[i] - takings[___]; best = Math.max(best,
    window); } return best;"
commonMistakes:
  - Re-adding every window from scratch, which does about n × k work.
  - Starting the best total at 0, which is wrong when everything is negative.
  - Stopping one step early, so the last window is never compared.
  - Forgetting to throw the RangeError for a bad window size.
explanationCheckpoint: Explain how you got the second window's total from the first. Then say your
  time complexity, and how it would change if you re-added every window.
interview:
  pattern: dsa.sliding-window
  timeComplexity: O(n)
  spaceComplexity: O(1)
rubric:
  - criterion: Correctness
    description: All tests pass, including the edge cases and the large inputs.
  - criterion: Complexity
    description: States the time and memory cost correctly, and explains why the slower obvious approach
      is slower.
  - criterion: Explanation
    description: Traces a small example step by step and says what the key data structure holds at each step.
