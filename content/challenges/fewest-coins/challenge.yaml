id: fewest-coins
title: Giving change with the fewest coins
type: algorithm
difficulty: 4
sequence: 11
context: cash-register
skills:
  - dsa.dp-1d
  - dsa.recursion
targetLevel: 3
objective: Build the answer for every amount from 0 upwards, so each smaller problem is solved once
  and reused.
lesson:
  concept: Dynamic programming solves each smaller problem once and reuses the answer
  realWorldProblem: A new country has coins of unusual values, and a cash register has to give change
    using as few coins as possible. 'Always hand over the biggest coin that fits' sometimes gives a
    worse answer, and trying every combination takes forever.
  whyItExists: The best way to make 100 cents is built from the best way to make a smaller amount,
    plus one coin. But the same smaller amounts come up again and again. A plain recursive solution
    solves them again every time, and the work doubles with each step. Writing each answer down the
    first time makes the whole thing fast.
  howItWorks: "Let best[a] be the fewest coins that make amount a. best[0] = 0, because no coins are
    needed. For each amount a from 1 upwards, try every coin c that is not bigger than a: using it
    leaves a - c, which costs best[a - c] coins, plus one for the coin itself. Keep the smallest. If
    no coin fits, the amount is impossible. Each amount is solved once, so the work is amount ×
    number of coins."
  example:
    code: |-
      function waysToClimb(steps) {
        const ways = new Array(steps + 1).fill(0);
        ways[0] = 1;
        for (let s = 1; s <= steps; s++) {
          ways[s] = ways[s - 1] + (s >= 2 ? ways[s - 2] : 0);
        }
        return ways[steps];
      }

      waysToClimb(5); // 8
    explanation: You can climb 1 or 2 steps at a time. The ways to reach step s are the ways to reach s
      - 1 (then take one step) plus the ways to reach s - 2 (then take two). Each ways[s] is worked
      out once from earlier ones, instead of re-counting the same sub-staircases.
  predict:
    code: |-
      const best = [0, Infinity, Infinity, Infinity, Infinity];
      for (let a = 1; a <= 4; a++) {
        for (const c of [1, 3]) {
          if (c <= a) best[a] = Math.min(best[a], best[a - c] + 1);
        }
      }
      console.log(best.join(','));
    question: What does this print?
    answer: 0,1,2,1,2
    why: "With coins 1 and 3: 1 needs one coin. 2 needs two ones. 3 needs one coin (the 3). 4 is 3 + 1,
      two coins. Each value is built from a smaller, already-known one."
  commonMistake: Picking the biggest coin that fits, every time. With coins 1, 3 and 4 and an amount
    of 6, that gives 4 + 1 + 1 (three coins), when 3 + 3 (two coins) is better.
problem: |-
  Write `fewestCoins(coins, amount)` and export it from solution.js. `coins` is a list of coin values in cents, in any order, and you have as many of each as you like. `amount` is a whole number of cents.

  Return the smallest number of coins that add up to exactly `amount`. Return `-1` if it cannot be done, and `0` for an amount of 0.
requirements:
  - Return the minimum number of coins that sum to exactly amount.
  - Coins can be used any number of times, and can be given in any order.
  - Return 0 for an amount of 0.
  - Return -1 when the amount cannot be made.
  - The coins [1, 3, 4] for 6 must give 2 (3 + 3), not 3 (4 + 1 + 1).
  - Finish in well under half a second for an amount of 100,000 with six coin values.
constraints:
  - Don't change the coins array you are given.
  - Plain recursion that doesn't remember answers will be far too slow here.
examples:
  - input: fewestCoins([1, 5, 10], 28)
    output: "6"
    note: 10 + 10 + 5 + 1 + 1 + 1
  - input: fewestCoins([1, 3, 4], 6)
    output: "2"
    note: 3 + 3, not 4 + 1 + 1.
  - input: fewestCoins([5, 10], 3)
    output: "-1"
edgeCasesToConsider:
  - An amount of 0?
  - An amount smaller than every coin?
  - Coins whose values don't combine to the amount?
  - Coins given in a mixed-up order?
beforeCoding:
  - For coins [1, 3, 4], write the fewest coins for amounts 0 to 6, one at a time. Which earlier
    answers did each one use?
  - What should the table hold for an amount that cannot be made?
hints:
  - To make amount a, you must use some last coin c. What does that leave you to make?
  - "Keep a table: best[a] is the fewest coins for amount a. Fill it from 0 upwards, so every
    smaller answer already exists when you need it."
  - Start every entry (except best[0]) at Infinity. At the end, Infinity means it cannot be done.
  - "Shape: const best = new Array(amount + 1).fill(Infinity); best[0] = 0; for (let a = 1; a <=
    amount; a++) { for (const coin of coins) { if (coin <= a) best[a] = Math.min(best[a], best[a -
    coin] + 1); } } return best[amount] === Infinity ? ___ : best[amount];"
commonMistakes:
  - Always taking the biggest coin that fits (greedy), which fails for some coin sets.
  - Recursing without remembering answers, which repeats the same work an enormous number of times.
  - Returning Infinity instead of -1 for an amount that cannot be made.
  - Forgetting that amount 0 needs 0 coins.
explanationCheckpoint: Explain what best[4] holds for coins [1, 3, 4], and which earlier entries it
  was built from. Then state your time and memory use, and say why remembering answers turns the
  recursive version from impossible to fast.
interview:
  pattern: dsa.dp-1d
  timeComplexity: O(n × k)
  spaceComplexity: O(n)
rubric:
  - criterion: Correctness
    description: All tests pass, including the edge cases and the large inputs.
  - criterion: Complexity
    description: States the time and memory cost correctly, and explains why the slower obvious approach
      is slower.
  - criterion: Explanation
    description: Traces a small example step by step and says what the key data structure holds at each step.
