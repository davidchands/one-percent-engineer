id: pair-for-sale
title: Two books that cost exactly the voucher
type: algorithm
difficulty: 3
sequence: 10
context: bookshop
skills:
  - dsa.two-pointers
  - dsa.complexity
targetLevel: 3
objective: Use two pointers walking inwards on sorted data, finding a pair in one pass with no extra memory.
lesson:
  concept: On sorted data, two pointers moving inwards can find a pair in one pass
  realWorldProblem: A bookshop sorts its price list from cheapest to dearest. A customer has a €20
    voucher and wants two books that use all of it. The shop has half a million titles and no spare
    memory on the till.
  whyItExists: "Trying every pair is O(n²), and a Map needs memory for every price. If the list is
    already sorted you can do better, and the sorted order is the whole trick: it tells you which
    way to move."
  howItWorks: "Put one marker (left) at the cheapest price and one (right) at the dearest. Add the
    two. If the total is too small, the only way to raise it is to move left up to a bigger price.
    If the total is too big, the only way to lower it is to move right down. If it matches, you are
    done. Each step discards one price that can never be part of an answer, so the markers meet
    after at most n steps: O(n) time and O(1) memory."
  example:
    code: |-
      function cheapestAndDearest(prices, total) {
        let left = 0;
        let right = prices.length - 1;
        while (left < right) {
          const sum = prices[left] + prices[right];
          if (sum === total) return [prices[left], prices[right]];
          if (sum < total) left++;
          else right--;
        }
        return null;
      }

      cheapestAndDearest([1, 3, 4, 8, 9], 12); // [3, 9]
    explanation: 1 + 9 = 10 is too small, so left moves up. 3 + 9 = 12 matches. We never looked at 4 or
      8 together with 9, because 3 + 9 had already told us what we needed to know.
  predict:
    code: |-
      const prices = [1, 3, 4, 8, 9];
      let left = 0, right = 4;
      console.log(prices[left] + prices[right] < 12);
    question: Which pointer should move next, if you want a bigger total?
    answer: left
    why: 10 is less than 12. Moving right down would make the total smaller still, and left is already
      the smallest price paired with the biggest. Only a bigger left can raise it.
  commonMistake: Letting the pointers cross or meet (left <= right). Then one book is paired with itself.
problem: |-
  Write `findPricePair(prices, voucher)` and export it from solution.js. `prices` is a list of whole numbers of cents, already sorted from lowest to highest. Return the two prices `[low, high]` of two different books that add up to exactly `voucher`, or `null` if there are none.

  If several pairs work, return the one with the lowest `low` price.
requirements:
  - Return [low, high] with low + high === voucher, using two different positions in the list.
  - If several pairs work, return the one with the lowest low price.
  - Return null when no pair works, and for a list with fewer than two prices.
  - Use no Map, Set or extra list. The list is sorted, so use that.
  - Finish in well under half a second for 500,000 prices.
constraints:
  - Don't change the array you are given.
  - Return the prices, not their positions.
examples:
  - input: findPricePair([1, 3, 4, 8, 9], 12)
    output: "[3, 9]"
  - input: findPricePair([2, 5, 5, 9], 10)
    output: "[5, 5]"
    note: Two different books that cost the same.
  - input: findPricePair([5, 9], 10)
    output: "null"
    note: 5 + 5 would use one book twice.
edgeCasesToConsider:
  - A voucher that needs two books with the same price?
  - One book that is exactly half the voucher?
  - A list with 0 or 1 books?
  - No pair at all?
beforeCoding:
  - For [1, 3, 4, 8, 9] and a voucher of 12, write the sum at each step and which pointer moves.
  - When should the loop stop, and what should it return then?
hints:
  - "Checking every pair is too slow for half a million books. The list is sorted: what does the sum
    of the cheapest and dearest tell you?"
  - Start one marker at each end. If the sum is too small, which marker can fix that? If it is too
    big?
  - Loop while left < right. If they meet, you would be using one book twice.
  - "Shape: let left = 0, right = prices.length - 1; while (left < right) { const sum = ___; if (sum
    === voucher) return ___; if (sum < voucher) ___; else ___; } return null;"
commonMistakes:
  - Checking every pair with two loops, which is O(n²).
  - Using left <= right, so a book pairs with itself.
  - Moving both pointers on every step, which skips answers.
  - Returning undefined instead of null when nothing matches.
explanationCheckpoint: Explain why you can safely move left up when the sum is too small, without
  missing an answer. Then state your time and memory use.
interview:
  pattern: dsa.two-pointers
  timeComplexity: O(n)
  spaceComplexity: O(1)
rubric:
  - criterion: Correctness
    description: All tests pass, including the edge cases and the large inputs.
  - criterion: Complexity
    description: States the time and memory cost correctly, and explains why the slower obvious approach
      is slower.
  - criterion: Explanation
    description: Traces a small example step by step and says what the key data structure holds at each step.
