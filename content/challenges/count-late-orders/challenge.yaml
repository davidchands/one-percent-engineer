id: count-late-orders
title: How many deliveries took at least this long?
type: algorithm
difficulty: 3
sequence: 12
context: delivery
skills:
  - dsa.binary-search
  - dsa.complexity
targetLevel: 3
objective: Use binary search to count the values at or above a limit in a sorted list, without an
  off-by-one error.
lesson:
  concept: Binary search finds a position in sorted data by halving the range each time
  realWorldProblem: A delivery company keeps every delivery time in minutes, sorted. Its dashboard is
    asked thousands of times a minute 'how many deliveries took at least 45 minutes?'. Counting by
    scanning the whole list each time is too slow.
  whyItExists: In a sorted list, one comparison in the middle rules out half of the list. Halve again
    and again and you find the spot in about 20 steps for a million items, where scanning takes a
    million.
  howItWorks: "Keep a range [low, high) of positions that could hold the answer. Look at the middle.
    If the middle value is too small, the answer must be to its right, so move low past it.
    Otherwise the middle could be the answer or the answer is to its left, so move high down to the
    middle. When low meets high, that position is the first value that is at least the limit.
    Everything from there to the end counts: length - position."
  example:
    code: |-
      function firstAtLeast(sorted, limit) {
        let low = 0;
        let high = sorted.length;
        while (low < high) {
          const mid = Math.floor((low + high) / 2);
          if (sorted[mid] < limit) low = mid + 1;
          else high = mid;
        }
        return low;
      }

      firstAtLeast([10, 20, 30, 40], 25); // 2
    explanation: The range starts as all four positions. The middle is 30, which is not below 25, so
      high moves to 2. The next middle is 20, which is below 25, so low moves to 2. low meets high
      at 2, and sorted[2] = 30 is the first value that is at least 25. If every value is too small,
      low ends at the length.
  predict:
    code: |-
      const sorted = [10, 20, 30, 40];
      let low = 0, high = 4;
      const mid = Math.floor((low + high) / 2);
      console.log(mid, sorted[mid]);
    question: What does this print?
    answer: 2 30
    why: (0 + 4) / 2 is 2, and sorted[2] is 30. With an even number of items there are two 'middles',
      and rounding down picks the left one.
  commonMistake: Using high = length - 1 with `low < high`. Then a limit bigger than every value
    cannot return the length, and the count comes out as 1 instead of 0.
problem: |-
  Write `countAtLeast(sortedTimes, limit)` and export it from solution.js. `sortedTimes` is a list of delivery times in minutes, sorted from smallest to largest (it can contain repeats). Return how many deliveries took `limit` minutes or more.

  The dashboard calls your function many times on the same big list, so it has to be fast.
requirements:
  - Return the number of values in the list that are greater than or equal to limit.
  - The list is sorted from smallest to largest. Use that.
  - Return 0 if no value is that large, and the length of the list if all of them are.
  - 20,000 calls on a list of 200,000 times must finish in well under half a second.
constraints:
  - Don't change the array you are given.
  - Don't loop over the whole list for each call.
examples:
  - input: countAtLeast([10, 20, 30, 40], 25)
    output: "2"
  - input: countAtLeast([10, 20, 20, 30], 20)
    output: "3"
    note: Values equal to the limit count.
  - input: countAtLeast([10, 20], 99)
    output: "0"
edgeCasesToConsider:
  - A limit smaller than every value?
  - A limit bigger than every value?
  - Many values equal to the limit?
  - An empty list?
beforeCoding:
  - For [10, 20, 20, 30] and a limit of 20, which position is the first value that counts? How does
    that give the count?
  - In a list of 8 values, what is the most positions you would have to look at?
hints:
  - If you know the position of the first value that counts, how do you get the count from the
    list's length?
  - Look at the middle value. If it is below the limit, what can you say about everything to its
    left?
  - Keep low and high as a range that could contain the position. Decide whether high starts at
    length or length - 1, then make the loop condition match.
  - "Shape: let low = 0, high = sortedTimes.length; while (low < high) { const mid = Math.floor((low
    + high) / 2); if (sortedTimes[mid] < limit) low = ___; else high = ___; } return
    sortedTimes.length - low;"
commonMistakes:
  - Scanning the whole list on every call, which is too slow for many calls.
  - Counting values above the limit but not equal to it.
  - Starting high at length - 1, so a limit above every value is miscounted.
  - Moving low to mid instead of mid + 1, which can loop forever.
explanationCheckpoint: Explain, for [10, 20, 20, 30] and a limit of 20, how low and high change on
  each step. Then state your time complexity for one call, and why it is so much smaller than
  scanning.
interview:
  pattern: dsa.binary-search
  timeComplexity: O(log n)
  spaceComplexity: O(1)
rubric:
  - criterion: Correctness
    description: All tests pass, including the edge cases and the large inputs.
  - criterion: Complexity
    description: States the time and memory cost correctly, and explains why the slower obvious approach
      is slower.
  - criterion: Explanation
    description: Traces a small example step by step and says what the key data structure holds at each step.
